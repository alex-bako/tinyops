name: Deploy staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      deploy-env: staging
      include-seed: true
      require-tag-on-main: false
    secrets: inherit
