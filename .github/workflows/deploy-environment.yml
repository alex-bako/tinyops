name: Deploy environment

on:
  workflow_call:
    inputs:
      deploy-env:
        description: TinyOps deploy environment.
        required: true
        type: string
      include-seed:
        description: Whether Supabase seed data is applied with migrations.
        required: true
        type: boolean
      require-tag-on-main:
        description: Whether to verify the current tag commit is reachable from main.
        required: true
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.18.3"
  SUPABASE_CLI_VERSION: "2.98.2"
  VERCEL_CLI_VERSION: "47.0.5"

jobs:
  deploy:
    name: Deploy ${{ inputs.deploy-env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy-env }}
    env:
      TINYOPS_DEPLOY_ENV: ${{ inputs.deploy-env }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOY_HEALTH_SECRET: ${{ secrets.DEPLOY_HEALTH_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.require-tag-on-main && 0 || 1 }}

      - name: Verify tag commit is on main
        if: ${{ inputs.require-tag-on-main }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          TINYOPS_DEPLOY_ENV: ${{ inputs.deploy-env }}
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          SYNC_WORKER_SECRET: ci-sync-secret
          CRON_SECRET: ci-cron-secret
          DEPLOY_HEALTH_SECRET: ci-health-secret
          TINYOPS_APP_BASE_URL: http://localhost:3000
          TINYOPS_LOG_LEVEL: debug

      - name: Link Supabase project
        run: |
          pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" link \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Preview Supabase migrations with seed
        if: ${{ inputs.include-seed }}
        run: pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" db push --linked --dry-run --password "${SUPABASE_DB_PASSWORD}" --include-seed

      - name: Preview Supabase migrations
        if: ${{ !inputs.include-seed }}
        run: pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" db push --linked --dry-run --password "${SUPABASE_DB_PASSWORD}"

      - name: Apply Supabase migrations with seed
        if: ${{ inputs.include-seed }}
        run: pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" db push --linked --password "${SUPABASE_DB_PASSWORD}" --include-seed

      - name: Apply Supabase migrations
        if: ${{ !inputs.include-seed }}
        run: pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" db push --linked --password "${SUPABASE_DB_PASSWORD}"

      - name: Pull Vercel environment
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="${VERCEL_TOKEN}"
        working-directory: apps/web

      - name: Build Vercel artifact
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod --token="${VERCEL_TOKEN}"
        working-directory: apps/web

      - name: Deploy Vercel artifact
        id: vercel-deploy
        run: |
          set -o pipefail
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="${VERCEL_TOKEN}" | tee /tmp/vercel-deploy.log
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app[^[:space:]]*' /tmp/vercel-deploy.log | tail -n 1)"
          test -n "${deployment_url}"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Smoke test deployment
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${DEPLOY_HEALTH_SECRET}" \
            "${{ steps.vercel-deploy.outputs.url }}/api/health"
